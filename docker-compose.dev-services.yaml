version: '3'

# Serviços de infraestrutura para desenvolvimento local
# Uso: docker compose -f docker-compose.dev-services.yaml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev:/data/postgres
    environment:
      - POSTGRES_DB=chatwoot_development
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=chatwoot
      - PGDATA=/data/postgres

  redis:
    image: redis:alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_dev:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_dev:
  redis_dev:
